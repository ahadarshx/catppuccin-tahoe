[package]
name = "tune"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
async-channel = "2.5.0"
env_logger = "0.11.11"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["pulseaudio-backend", "native-tls"] }
log = "0.4.34"
mpris-server = "0.10.0"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "openssl_crypto"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
