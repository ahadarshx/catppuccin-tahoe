# Ghostty 1.3.1 + Fedora 45 systemd: "Main process lacks handler for reload
# signal USR2, refusing service startup" breaks launching from the dock/app
# grid (D-Bus activation). Treat it as a plain D-Bus service instead; it is
# ready once it owns com.mitchellh.ghostty. `systemctl --user reload` still
# sends SIGUSR2 to reload the config.
[Service]
Type=dbus
ExecReload=/bin/kill -USR2 $MAINPID
